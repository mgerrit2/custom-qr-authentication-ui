<div class="container-fluid mx-auto px-4 py-6 max-w-md">


  <form [formGroup]="form" >
    <div class="row my-4">
      <!-- Alleen tonen als er daadwerkelijk een QR-code geladen is -->
      @if (imageBytes) {
        <div class="p-0">
          <img [src]="imageBytes"
               [width]="200"
               [height]="200"
               class="profile-rect"
               alt="2FA QR Code"
          />
        </div>
      } @else {
        <!-- Show default empty placeholder rectangle -->
        <div class="profile-rect placeholder-rect"
             style="width: 200px; height: 200px; display: flex; align-items: center; justify-content: center; background-color: #f8f9fa; border: 2px dashed #dee2e6;">
          <span class="text-muted small">No QR Code</span>
        </div>
      }
    </div>

    <div class="row my-4">
      <!-- PrimeNG Button -->
      <p-button
        label="Genereer QR Code"
        (onClick)="getQrCode()"
      />
    </div>

    <div class="row my-4">

      <p-button
        label="Validate code"
        (onClick)="validateCode()"
      />
    </div>

    <div class="flex justify-center">

      <p-floatlabel>
        <input pInputText id="numberToValidate"
               formControlName="numberToValidate"
               autocomplete="off"
        />
        <label for="over_label">Number to validate</label>
      </p-floatlabel>

    </div>

    <div class="flex justify-center my-4">

      <p-floatlabel>
        <input pInputText id="isValidateCode"
               formControlName="isValidateCode"
               autocomplete="off"
        />
        <label for="over_label">Result</label>
      </p-floatlabel>

    </div>

  </form>

</div>
